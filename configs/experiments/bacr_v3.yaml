  description: "BACR-v3 Minimal Teacher: Single-Pass Route + Single Intervention + Revert Safeguard"
  task:
    mode: target_guided
    gold_aspects: true
    single_aspect: true
  model_config: configs/models/gemini.yaml
  dataset_config: configs/datasets/twitter15.yaml
