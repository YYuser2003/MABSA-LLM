    max_deep_actions: 1
    max_visual_probes: 1
  aspect_lock: true
  controller:
    single_pass_route: true
    evidence_firewall: true
    final_audit: true
  vision:
    global_always_on: true
    deep_probe: targeted
  canonical_t0: true
  canonical_v0: true
  concurrency: 6

